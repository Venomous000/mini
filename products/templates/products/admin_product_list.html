<!-- templates/products/admin_product_list.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Admin Product List</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto bg-white shadow rounded p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">All Products</h2>
            <div class="space-x-4">
                <a href="{% url 'add_product' %}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Add Product</a>
                <a href="{% url 'add_category' %}" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Add Category</a>
                <a href="{% url 'superadmin_logout' %}" class="text-red-500 hover:underline">Logout</a>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for product in products %}
            <div class="bg-gray-50 border border-gray-200 rounded shadow-sm p-4">
                <h3 class="text-lg font-semibold text-gray-800">{{ product.product_name }}</h3>
                <p class="text-gray-600 text-sm mb-2">Price: ${{ product.price_per_piece }}</p>

                <div class="flex flex-wrap gap-2 mb-3">
                    {% for image in product.images.all %}
                        <img src="{{ image.image.url }}" alt="Product Image" class="w-16 h-16 object-cover rounded border">
                    {% empty %}
                        <p class="text-gray-400 text-sm italic">No images uploaded.</p>
                    {% endfor %}
                </div>

                <div class="flex flex-wrap gap-2">
                    <a href="{% url 'edit_product' product.id %}" class="text-blue-600 hover:underline">Edit</a>
                    <a href="{% url 'delete_product' product.id %}" class="text-red-600 hover:underline">Delete</a>
                    <a href="{% url 'upload_product_image' product.id %}" class="text-indigo-600 hover:underline">Upload Image</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
