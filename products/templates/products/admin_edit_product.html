<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 py-10">
    <div class="max-w-2xl mx-auto bg-white shadow-md rounded p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit Product</h2>

        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded">
                Update Product
            </button>
        </form>

        {% if product.images.all %}
        <div class="mt-10">
            <h3 class="text-lg font-semibold mb-3">Product Images</h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                {% for img in product.images.all %}
                <div class="relative group border rounded overflow-hidden shadow">
                    <img src="{{ img.image.url }}" alt="Image" class="w-full h-40 object-cover">
                    <a href="{% url 'admin_delete_product_image' img.id %}"
                       onclick="return confirm('Are you sure you want to delete this image?');"
                       class="absolute top-1 right-1 bg-red-600 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition">
                        Delete
                    </a>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <div class="mt-6">
            <a href="{% url 'admin_product_list' %}" class="text-blue-600 hover:underline">← Back to Product List</a>
        </div>
    </div>
</body>
</html>
