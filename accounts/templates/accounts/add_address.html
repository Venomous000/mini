{% extends 'base/user_base.html' %}
{% block title %}Add Address{% endblock %}

{% block content %}
<h2 class="text-2xl font-semibold mb-6">Add New Address</h2>

<form method="POST" class="bg-white p-6 rounded shadow w-full max-w-md">
    {% csrf_token %}

    <div class="mb-4">
        <label class="block text-gray-700">Street Address</label>
        <input type="text" name="street_address" class="w-full px-3 py-2 border rounded" required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-700">City</label>
        <input type="text" name="city" class="w-full px-3 py-2 border rounded" required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-700">Province</label>
        <input type="text" name="province" class="w-full px-3 py-2 border rounded" required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-700">Country</label>
        <input type="text" name="country" class="w-full px-3 py-2 border rounded" required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-700">Zip Code</label>
        <input type="text" name="zip_code" class="w-full px-3 py-2 border rounded" required>
    </div>

    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded w-full">
        Add Address
    </button>
</form>

<p class="mt-4 text-sm">
    <a href="{% url 'manage_addresses' %}" class="text-blue-600 hover:underline">Back to Addresses</a>
</p>
{% endblock %}
