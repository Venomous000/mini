{% extends 'base/user_base.html' %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-6">Edit Profile</h2>
<form method="POST" class="bg-white p-6 rounded shadow w-full max-w-md">
    {% csrf_token %}
    <div class="mb-4">
        <label class="block text-gray-700">Name</label>
        <input type="text" name="name" value="{{ user.name }}" class="w-full px-3 py-2 border rounded" required>
    </div>
    <div class="mb-4">
        <label class="block text-gray-700">Phone Number</label>
        <input type="text" name="phone_number" value="{{ user.phone }}" class="w-full px-3 py-2 border rounded" required>
    </div>
    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded w-full">Update Profile</button>
</form>
<p class="mt-4 text-sm"><a href="{% url 'view_profile' %}" class="text-blue-600 hover:underline">Back to Profile</a></p>
{% endblock %}
