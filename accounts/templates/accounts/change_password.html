{% extends 'base/user_base.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
<h2 class="text-2xl font-semibold mb-6">Change Password</h2>

<form method="POST" class="bg-white p-6 rounded shadow w-full max-w-md">
    {% csrf_token %}
    
    <div class="mb-4">
        <label class="block text-gray-700">Current Password</label>
        <input type="password" name="current_password" class="w-full px-3 py-2 border rounded" required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-700">New Password</label>
        <input type="password" name="new_password" class="w-full px-3 py-2 border rounded" required>
    </div>

    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded w-full">
        Change Password
    </button>
</form>

<p class="mt-4 text-sm">
    <a href="{% url 'view_profile' %}" class="text-blue-600 hover:underline">Back to Profile</a>
</p>
{% endblock %}
