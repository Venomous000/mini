{% extends 'base/user_base.html' %}
{% block title %}Edit Address{% endblock %}

{% block content %}
<h2 class="text-2xl font-semibold mb-6">Edit Address</h2>

<form method="POST" class="bg-white p-6 rounded shadow w-full max-w-md">
    {% csrf_token %}

    <div class="mb-4">
        <label class="block text-gray-700">Street Address</label>
        <input type="text" name="street_address" value="{{ address.street_address }}" class="w-full px-3 py-2 border rounded" required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-700">City</label>
        <input type="text" name="city" value="{{ address.city }}" class="w-full px-3 py-2 border rounded" required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-700">Province</label>
        <input type="text" name="province" value="{{ address.province }}" class="w-full px-3 py-2 border rounded" required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-700">Country</label>
        <input type="text" name="country" value="{{ address.country }}" class="w-full px-3 py-2 border rounded" required>
    </div>

    <div class="mb-4">
        <label class="block text-gray-700">Zip Code</label>
        <input type="text" name="zip_code" value="{{ address.zip_code }}" class="w-full px-3 py-2 border rounded" required>
