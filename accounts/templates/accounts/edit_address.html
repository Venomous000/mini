{% extends 'base/user_base.html' %}
{% block title %}Edit Address{% endblock %}
{% block content %}
<h2>Edit Address</h2>
<form method="POST">
    {% csrf_token %}
    <label>Street Address:</label>
    <input type="text" name="street_address" value="{{ address.street_address }}" required><br><br>

    <label>City:</label>
    <input type="text" name="city" value="{{ address.city }}" required><br><br>

    <label>Province:</label>
    <input type="text" name="province" value="{{ address.province }}" required><br><br>

    <label>Country:</label>
    <input type="text" name="country" value="{{ address.country }}" required><br><br>

    <label>Zip Code:</label>
    <input type="text" name="zip_code" value="{{ address.zip_code }}" required><br><br>

    <button type="submit">Update Address</button>
</form>
<a href="{% url 'manage_addresses' %}">Back to Addresses</a>
{% endblock %}
