<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}User Area{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <nav class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <div class="space-x-4">
      <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}text-blue-600 font-semibold{% else %}text-gray-700{% endif %}">Home</a>
      <a href="{% url 'view_profile' %}" class="{% if request.resolver_match.url_name == 'view_profile' %}text-blue-600 font-semibold{% else %}text-gray-700{% endif %}">Profile</a>
      <a href="{% url 'manage_addresses' %}" class="{% if request.resolver_match.url_name == 'manage_addresses' %}text-blue-600 font-semibold{% else %}text-gray-700{% endif %}">Addresses</a>
      <a href="{% url 'view_orders' %}" class="{% if request.resolver_match.url_name == 'view_orders' %}text-blue-600 font-semibold{% else %}text-gray-700{% endif %}">Orders</a>
      <a href="{% url 'view_cart' %}" class="{% if request.resolver_match.url_name == 'view_cart' %}text-blue-600 font-semibold{% else %}text-gray-700{% endif %}">Cart</a>
    </div>
    <a href="{% url 'logout' %}" class="text-red-500 font-semibold hover:underline">Logout</a>
  </nav>

  <main class="max-w-4xl mx-auto px-4 py-8">
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="p-4 rounded text-white {% if message.tags == 'error' %}bg-red-500{% elif message.tags == 'success' %}bg-green-500{% else %}bg-blue-500{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    
    {% block content %}{% endblock %}
  </main>
</body>
</html>
