<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Order Management</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto py-8 px-4">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Order Management</h1>

        <!-- Filter Form -->
        <form method="get" action="{% url 'admin_order_list' %}" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-6 gap-4 bg-white p-6 rounded shadow border border-gray-200 mb-6">
            <input type="text" name="email" value="{{ email_query }}" placeholder="User Email" class="border rounded px-3 py-2">
            <input type="text" name="city" value="{{ city_query }}" placeholder="City" class="border rounded px-3 py-2">
            <input type="text" name="province" value="{{ province_query }}" placeholder="Province" class="border rounded px-3 py-2">
            <input type="text" name="country" value="{{ country_query }}" placeholder="Country" class="border rounded px-3 py-2">
            <input type="text" name="zip_code" value="{{ zip_query }}" placeholder="Zip Code" class="border rounded px-3 py-2">
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Search</button>
        </form>

        <!-- Orders Table -->
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-200 rounded shadow text-sm text-gray-700">
                <thead class="bg-gray-100">
                    <tr class="text-left">
                        <th class="px-4 py-2 border-b">Order ID</th>
                        <th class="px-4 py-2 border-b">User Email</th>
                        <th class="px-4 py-2 border-b">Total Amount</th>
                        <th class="px-4 py-2 border-b">Date</th>
                        <th class="px-4 py-2 border-b text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for order in orders %}
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-2 border-b">{{ order.id }}</td>
                            <td class="px-4 py-2 border-b">{{ order.user.email }}</td>
                            <td class="px-4 py-2 border-b">${{ order.total_amount }}</td>
                            <td class="px-4 py-2 border-b">{{ order.order_date|date:"Y-m-d H:i" }}</td>
                            <td class="px-4 py-2 border-b text-center">
                                <a href="{% url 'admin_order_detail' order.id %}" class="text-blue-600 hover:underline">View</a>
                            </td>
                        </tr>
                    {% empty %}
                        <tr>
                            <td colspan="5" class="px-4 py-4 text-center text-gray-500">No orders found.</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
