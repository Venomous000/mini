{% extends 'base/user_base.html' %}
{% block title %}Confirm Delete Order{% endblock %}

{% block content %}
<div class="bg-white p-6 rounded shadow-md max-w-lg mx-auto mt-10 text-center">
    <h2 class="text-xl font-bold mb-4">Confirm Delete</h2>
    <p class="text-gray-700 mb-6">
        Are you sure you want to delete this order placed on <strong>{{ order.order_date }}</strong>?
    </p>

    <form method="POST" class="flex justify-center gap-4">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Yes, Delete</button>
        <a href="{% url 'order_history' %}" class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400">Cancel</a>
    </form>
</div>
{% endblock %}
