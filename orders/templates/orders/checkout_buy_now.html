<h2>Checkout - Buy Now</h2>

<p><strong>Product:</strong> {{ product.product_name }}</p>
<p><strong>Price:</strong> {{ product.price_per_piece }}</p>
<p><strong>Stock:</strong> {{ product.stock_quantity }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Place Order</button>
</form>

<a href="{% url 'product_detail' product.id %}">Cancel</a>
